<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MuchoOcio</title>
  <meta name="description" content="Mi rincón de anime, series, cartoons y películas, con ranking.">

  <!-- Ícono de la pestaña -->
  <link rel="icon" href="img/logo.png">

  <!-- Tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

  <header class="cabecera">
    <a class="logo" href="#inicio">
      <img class="logo__img" src="img/logo.png" alt="">
      <span class="logo__texto">Mucho<span>Ocio</span></span>
    </a>
    <nav id="menu" class="menu" aria-label="Secciones"></nav>
  </header>

  <main id="contenido" class="contenido">
    <noscript>Esta página necesita JavaScript para mostrar el contenido.</noscript>
  </main>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal__fondo" data-cerrar></div>
    <div class="modal__caja" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <button class="modal__cerrar" type="button" aria-label="Cerrar" data-cerrar>×</button>
      <div id="modal-contenido"></div>
    </div>
  </div>

  <footer class="pie">
    <p>MuchoOcio · 2026</p>
  </footer>

  <script src="js/datos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
